<!-- Root configuration element for Wazuh OSSEC -->
<ossec_config>
  <!-- Global settings for logging and system behavior -->
  <global>
    <!-- Enable logging of all events -->
    <logall>yes</logall>
    <!-- Enable JSON formatted logging output -->
    <logall_json>yes</logall_json>
  </global>

  <!-- Alert configuration settings -->
  <alerts>
    <!-- Set minimum alert level threshold (3 = warning level) -->
    <log_alert_level>3</log_alert_level>
  </alerts>

  <!-- Remote communication settings -->
  <remote>
    <!-- Use secure connection for remote communication -->
    <connection>secure</connection>
    <!-- Port number for remote agent connections -->
    <port>1514</port>
  </remote>

  <!-- Agent authentication settings -->
  <auth>
    <!-- Enable authentication (not disabled) -->
    <disabled>no</disabled>
    <!-- Port for agent authentication -->
    <port>1515</port>
  </auth>
</ossec_config>