services:
  # ==========================================
  # WAZUH INDEXER (avec sécurité activée)
  # ==========================================
  indexer:
    build: ./wazuh/wazuh-indexer
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - plugins.security.disabled=false           # ← ACTIVER LA SÉCURITÉ
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MonSuperMotDePasse123!   # ← MOT DE PASSE ADMIN
      - discovery.type=single-node
    volumes:
      - ./wazuh/wazuh-indexer/config/opensearch.yml:/usr/local/opensearch/config/opensearch.yml
      - ./wazuh/wazuh-indexer/data:/usr/local/opensearch/data
    networks:
      - wazuh-net

  # ==========================================
  # WAZUH DASHBOARD (avec connexion sécurisée)
  # ==========================================
  dashboard:
    build: ./wazuh/wazuh-dashboard
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=https://wazuh-indexer:9200    # ← HTTPS maintenant
      - OPENSEARCH_USERNAME=admin                      
      - OPENSEARCH_PASSWORD=admin123!    
    volumes:
      - ./wazuh/wazuh-dashboard/config/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
    depends_on:
      - indexer
    networks:
      - wazuh-net


networks:
  wazuh-net:
    driver: bridge