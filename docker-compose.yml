version: "3.9"

services:


  # 1. NGINX (Reverse Proxy)
 
  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - wazuh-dashboard
      - keycloak
      - liferay
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      
    networks:
      - soc-net


  # 2. WAZUH MANAGER (SIEM)
  
  wazuh-manager:
    build: ./wazuh-manager
    container_name: wazuh-manager
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - ./wazuh/wazuh-manager/config/ossec.conf:/var/ossec/etc/ossec.conf
      - ./wazuh/wazuh-manager/logs:/var/ossec/logs
    networks:
      - soc-net


  # 3. WAZUH INDEXER (OpenSearch)
 
  wazuh-indexer:
    build: ./wazuh-indexer
    container_name: wazuh-indexer
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - ./wazuh/wazuh-indexer/config/opensearch.yml:/usr/local/opensearch/config/opensearch.yml
      - ./wazuh/wazuh-indexer/data:/usr/local/opensearch/data
    networks:
      - soc-net


  # 4. WAZUH DASHBOARD
 
  wazuh-dashboard:
    build: ./wazuh-dashboard
    container_name: wazuh-dashboard
    ports:
      - "5601:5601"
    depends_on:
      - wazuh-indexer
    
    volumes:
      - ./wazuh/wazuh-dashboard/config/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
    networks:
      - soc-net


  # 5. KEYCLOAK 
 
  keycloak:
    build: ./keycloak
    container_name: keycloak
    ports:
      - "8080:8080"
    
    volumes:
      - ./keycloak/config/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - soc-net


  # 6. LIFERAY (PORTAL SOC)
 
  liferay:
    build: ./liferay
    container_name: liferay
    ports:
      - "8081:8081"
    volumes:
      - ./liferay/config:/opt/liferay/config
      - ./liferay/data:/opt/liferay/data
    networks:
      - soc-net


  #  ANSIBLE (AUTOMATION / SOA)
 
  ansible:
    build: ./ansible
    container_name: ansible
    volumes:
      - ./ansible/playbooks:/ansible/playbooks
      - ./ansible/inventory:/etc/ansible/hosts
      - ./ansible/ansible.cfg:/etc/ansible/ansible.cfg
    networks:
      - soc-net

#reseau SOC
networks:
  soc-net:
    driver: bridge
